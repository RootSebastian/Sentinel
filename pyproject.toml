[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backup"
description = "Automatic backups and a friendly system monitor for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian" }]
keywords = ["backup", "rsync", "system-monitor", "linux", "pyqt", "task-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyQt6>=6.5",
    "psutil>=5.9",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/sentinel"
Issues = "https://github.com/YOUR_USERNAME/sentinel/issues"

[project.scripts]
sentinel = "sentinel.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sentinel", "sentinel.ui"]

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
