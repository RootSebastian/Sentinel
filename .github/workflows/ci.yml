name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 psutil pytest

      - name: Compile all modules
        run: python -m compileall -q sentinel

      - name: Run tests (offscreen)
        run: QT_QPA_PLATFORM=offscreen pytest -q

  # Pushing a version tag (git tag v1.3.0 && git push origin v1.3.0)
  # builds the release zip and attaches it to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: git archive --format=zip -o "sentinel-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sentinel-*.zip
          generate_release_notes: true
