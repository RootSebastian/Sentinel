name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 psutil pytest

      - name: Compile all modules
        run: python -m compileall -q sentinel

      - name: Run tests (offscreen)
        run: QT_QPA_PLATFORM=offscreen pytest -q
